name: Scrape Pashupatinath Reviews

on:
  schedule:
    - cron: '0 0 */15 * *'   # Every 15 days at midnight UTC
  workflow_dispatch:           # Manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run scraper
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scraper/scraper.py

      - name: Validate output
        run: |
          python scraper/validate.py

      - name: Upload raw data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-reviews-${{ github.run_id }}
          path: raw_reviews/
          retention-days: 30

      # ========== NEW: Databricks Upload ==========
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Upload to Unity Catalog Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Create dated folder in volume
          RUN_DATE=$(date +%Y%m%d_%H%M%S)
          TARGET_PATH="/Volumes/workspace/default/raw_tripadvisor_reviews/run_${RUN_DATE}"

          echo "Uploading to ${TARGET_PATH}"

          # Upload JSONL and manifest
          databricks fs cp raw_reviews/reviews_*.jsonl "${TARGET_PATH}/"
          databricks fs cp raw_reviews/manifest_*.json "${TARGET_PATH}/"

          # Also upload individual page files for audit
          databricks fs cp -r raw_reviews/page_*.json "${TARGET_PATH}/pages/"

          echo "✓ Upload complete: ${TARGET_PATH}"